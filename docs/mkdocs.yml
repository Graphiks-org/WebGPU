site_name: WebGPU
site_description: Kotlin Multiplatform WebGPU types and API reference
site_url: https://graphiks-org.github.io/WebGPU/
repo_url: https://github.com/Graphiks-org/WebGPU
repo_name: Graphiks-org/WebGPU

docs_dir: docs
site_dir: ../_site
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Public API Contract: public-api-contract.md
  - Architecture: architecture.md
  - Testing: testing.md
  - Suite: suite.md
  - Specification Maintenance: specification-maintenance.md
  - Type Mapping:
      - Overview: type-mapping/index.md
      - Primitives and buffers: type-mapping/primitives-and-buffers.md
      - Enumerations and flags: type-mapping/enumerations-and-flags.md
      - Dictionaries and unions: type-mapping/dictionaries-and-unions.md
      - Excluded types: type-mapping/excluded-types.md
  - Reference:
      - webgpu-api: api/webgpu-api/index.md
      - webgpu-descriptors: api/webgpu-descriptors/index.md
      - webgpu-web-bindings: api/webgpu-web-bindings/index.md
      - webgpu-browser: api/webgpu-browser/index.md

# !!! EMBEDDED DOKKA START, DO NOT COMMIT !!! #
# !!! EMBEDDED DOKKA END, DO NOT COMMIT !!! #

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: WebGPU
          site_description: Types WebGPU Kotlin Multiplatform et référence API
          nav_translations:
            Home: Accueil
            Getting Started: Démarrage
            Public API Contract: Contrat de l’API publique
            Architecture: Architecture
            Testing: Tests
            Specification Maintenance: Maintenance des spécifications
            Type Mapping: Correspondance des types
            Overview: Vue d'ensemble
            Primitives and buffers: Primitives et buffers
            Enumerations and flags: Énumérations et drapeaux
            Dictionaries and unions: Dictionnaires et unions
            Excluded types: Types exclus
            Reference: Référence API
