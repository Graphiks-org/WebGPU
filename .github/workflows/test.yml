name: Tests

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Business tests
        run: ./gradlew --no-daemon check
      - name: Browser target tests
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon :webgpu-api:jsNodeTest :webgpu-api:wasmJsNodeTest :webgpu-web-bindings:jsNodeTest :webgpu-web-bindings:wasmJsNodeTest :webgpu-browser:jsNodeTest :webgpu-browser:wasmJsNodeTest
      - name: Public ABI
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon :webgpu-api:checkKotlinAbi
  browser-gpu:
    uses: ./.github/workflows/browser-gpu.yml
