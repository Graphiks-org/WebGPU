name: Tests

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    uses: ./.github/workflows/suite.yml

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Tests and checks
        run: ./gradlew --no-daemon check
      - name: Report tooling tests
        run: node --test tools/arraybuffer-report.test.mjs tools/compare-arraybuffer-benchmarks.test.mjs

  # The Android target has no unit-test task in the KMP library plugin, so the ArrayBuffer
  # business matrix runs instrumented, on an emulator, as a peer of the other test targets.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented ArrayBuffer business tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Only the business matrix runs on pull requests; the campaign test stays available to
          # the local Android runner (tools/run-arraybuffer-android.mjs).
          script: ./gradlew --no-daemon :arraybuffer-benchmarks-android:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.graphiks.webgpu.benchmarks.runner.AndroidBenchmarkTest#arrayBufferSafetyChecks
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-android-tests
          path: arraybuffer-benchmarks-android/build/reports/androidTests/
