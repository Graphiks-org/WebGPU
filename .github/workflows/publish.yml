name: Publish to Maven Central

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional snapshot version (default: 0.1.0-SNAPSHOT)'
        required: false

permissions:
  contents: read

jobs:
  suite:
    uses: ./.github/workflows/suite.yml

  snapshot:
    needs: suite
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate snapshot version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9][0-9A-Za-z.+-]*-SNAPSHOT$ ]]; then
              echo 'Snapshot override must be a version ending in -SNAPSHOT.' >&2
              exit 1
            fi
            printf 'VERSION=%s\n' "$INPUT_VERSION" >> "$GITHUB_ENV"
          fi
      - name: Check publication credentials
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required publication credential: %s\n' "$name" >&2
              exit 1
            fi
          done
      - name: Build and test
        shell: bash
        run: |
          args=()
          if [[ -n "${VERSION:-}" ]]; then args+=("-PreleaseVersion=$VERSION"); fi
          ./gradlew --no-configuration-cache --no-daemon check "${args[@]}"
      - name: Publish snapshot
        shell: bash
        run: |
          args=()
          if [[ -n "${VERSION:-}" ]]; then args+=("-PreleaseVersion=$VERSION"); fi
          ./gradlew --no-configuration-cache --no-daemon \
            :webgpu-api:publishToMavenCentral \
            :webgpu-descriptors:publishToMavenCentral \
            :webgpu-web-bindings:publishToMavenCentral \
            :webgpu-browser:publishToMavenCentral \
            :suite-core:publishToMavenCentral \
            :suite-acid-tests:publishToMavenCentral \
            :suite-demos:publishToMavenCentral \
            :suite-benchmarks:publishToMavenCentral "${args[@]}"

  release:
    needs: suite
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ || "$VERSION" == *-SNAPSHOT ]]; then
            echo 'Release tag must be v followed by a non-SNAPSHOT version.' >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Check publication credentials
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required publication credential: %s\n' "$name" >&2
              exit 1
            fi
          done
      - name: Build and test
        run: ./gradlew --no-configuration-cache --no-daemon check "-PreleaseVersion=$VERSION"
      - name: Publish release
        run: |
          ./gradlew --no-configuration-cache --no-daemon \
            :webgpu-api:publishToMavenCentral \
            :webgpu-descriptors:publishToMavenCentral \
            :webgpu-web-bindings:publishToMavenCentral \
            :webgpu-browser:publishToMavenCentral \
            :suite-core:publishToMavenCentral \
            :suite-acid-tests:publishToMavenCentral \
            :suite-demos:publishToMavenCentral \
            :suite-benchmarks:publishToMavenCentral "-PreleaseVersion=$VERSION"
