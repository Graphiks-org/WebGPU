name: ArrayBuffer CPU

# Correctness and report validity are blocking; durations are informative. Standard campaigns are
# manual (workflow_dispatch) and run on stable hosts outside the shared runners.
on:
  pull_request:
    paths:
      - 'webgpu-api/**'
      - 'arraybuffer-benchmarks/**'
      - 'arraybuffer-benchmarks-android/**'
      - 'tools/arraybuffer-*.mjs'
      - 'tools/run-arraybuffer-*.mjs'
      - 'tools/compare-arraybuffer-*.mjs'
      - '.github/workflows/arraybuffer.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      profile:
        description: Campaign profile
        type: choice
        options: [ci, standard]
        default: ci

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Install browser tooling
        run: |
          npm ci --prefix tools
          npm exec --prefix tools -- playwright install --with-deps chromium
      - name: Correctness tests and ABI
        run: |
          ./gradlew --no-daemon \
            :webgpu-api:jvmTest :webgpu-api:jsNodeTest :webgpu-api:wasmJsNodeTest \
            :webgpu-api:linuxX64Test :webgpu-api:checkKotlinAbi \
            :arraybuffer-benchmarks:jvmTest :arraybuffer-benchmarks:jsNodeTest :arraybuffer-benchmarks:wasmJsNodeTest \
            :arraybuffer-benchmarks:jsBrowserDistribution :arraybuffer-benchmarks:wasmJsBrowserDistribution
      - name: Report tooling tests
        run: node --test tools/arraybuffer-report.test.mjs tools/compare-arraybuffer-benchmarks.test.mjs
      - name: Smoke campaign (JVM)
        run: |
          ./gradlew --no-daemon :arraybuffer-benchmarks:runJvmBenchmarks \
            --args="--profile=ci --output=build/reports/arraybuffer/ci-jvm.json --run-index=0"
          node tools/arraybuffer-report.mjs build/reports/arraybuffer/ci-jvm.json --profile=ci
      - name: Smoke campaign (JS and Wasm)
        run: |
          node tools/run-arraybuffer-benchmarks.mjs js \
            arraybuffer-benchmarks/build/dist/js/productionExecutable \
            --profile=ci --run-index=0 --output=build/reports/arraybuffer/ci-js.json
          node tools/run-arraybuffer-benchmarks.mjs wasm \
            arraybuffer-benchmarks/build/dist/wasmJs/productionExecutable \
            --profile=ci --run-index=0 --output=build/reports/arraybuffer/ci-wasm.json
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-reports-ubuntu
          path: build/reports/arraybuffer/

  native:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Native tests and smoke campaign
        run: |
          ./gradlew --no-daemon \
            :webgpu-api:macosArm64Test \
            :arraybuffer-benchmarks:macosArm64Test :arraybuffer-benchmarks:linkReleaseExecutableMacosArm64
          mkdir -p build/reports/arraybuffer
          arraybuffer-benchmarks/build/bin/macosArm64/releaseExecutable/arraybuffer-benchmarks.kexe \
            --profile=ci --run-index=0 --output=build/reports/arraybuffer/ci-native.json
          node tools/arraybuffer-report.mjs build/reports/arraybuffer/ci-native.json --profile=ci
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-reports-macos
          path: build/reports/arraybuffer/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented safety checks and smoke campaign
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew --no-daemon :arraybuffer-benchmarks-android:connectedReleaseAndroidTest
            ./gradlew --no-daemon :arraybuffer-benchmarks-android:installRelease
            npm ci --prefix tools
            node tools/run-arraybuffer-android.mjs --profile=ci --run-index=0 \
              --output=build/reports/arraybuffer/ci-android.json
            node tools/arraybuffer-report.mjs build/reports/arraybuffer/ci-android.json --profile=ci
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-reports-android
          path: build/reports/arraybuffer/

  standard-campaign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Install browser tooling
        run: |
          npm ci --prefix tools
          npm exec --prefix tools -- playwright install --with-deps chromium
      - name: Standard campaigns (five launches)
        run: |
          ./gradlew --no-daemon :arraybuffer-benchmarks:jsBrowserDistribution :arraybuffer-benchmarks:wasmJsBrowserDistribution
          for run in 0 1 2 3 4; do
            ./gradlew --no-daemon :arraybuffer-benchmarks:runJvmBenchmarks \
              --args="--profile=standard --output=build/reports/arraybuffer/standard-jvm-run$run.json --run-index=$run"
            node tools/run-arraybuffer-benchmarks.mjs js \
              arraybuffer-benchmarks/build/dist/js/productionExecutable \
              --profile=standard --run-index=$run --output=build/reports/arraybuffer/standard-js-run$run.json
            node tools/run-arraybuffer-benchmarks.mjs wasm \
              arraybuffer-benchmarks/build/dist/wasmJs/productionExecutable \
              --profile=standard --run-index=$run --output=build/reports/arraybuffer/standard-wasm-run$run.json
          done
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-standard-reports
          path: build/reports/arraybuffer/
