name: ArrayBuffer CPU

# Correctness is blocking; benchmark campaigns never run on pull requests — they are manual
# (workflow_dispatch) and belong on a stable host, since a shared runner is not a performance
# reference. The Android job runs the ArrayBuffer business matrix on an emulator.
on:
  pull_request:
    paths:
      - 'webgpu-api/**'
      - 'arraybuffer-benchmarks/**'
      - 'arraybuffer-benchmarks-android/**'
      - 'tools/arraybuffer-*.mjs'
      - 'tools/run-arraybuffer-*.mjs'
      - 'tools/compare-arraybuffer-*.mjs'
      - '.github/workflows/arraybuffer.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      profile:
        description: Campaign profile
        type: choice
        options: [ci, standard]
        default: ci

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Correctness tests and ABI
        run: |
          ./gradlew --no-daemon \
            :webgpu-api:jvmTest :webgpu-api:jsNodeTest :webgpu-api:wasmJsNodeTest \
            :webgpu-api:linuxX64Test :webgpu-api:checkKotlinAbi \
            :arraybuffer-benchmarks:jvmTest :arraybuffer-benchmarks:jsNodeTest :arraybuffer-benchmarks:wasmJsNodeTest
      - name: Report tooling tests
        run: node --test tools/arraybuffer-report.test.mjs tools/compare-arraybuffer-benchmarks.test.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-reports-ubuntu
          path: build/reports/

  native:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Native tests
        run: |
          ./gradlew --no-daemon \
            :webgpu-api:macosArm64Test \
            :arraybuffer-benchmarks:macosArm64Test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented business tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Only the business matrix runs on pull requests; the campaign test stays available to
          # the manual Android runner (tools/run-arraybuffer-android.mjs).
          script: ./gradlew --no-daemon :arraybuffer-benchmarks-android:connectedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.graphiks.webgpu.benchmarks.runner.AndroidBenchmarkTest#arrayBufferSafetyChecks
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-android-tests
          path: arraybuffer-benchmarks-android/build/reports/androidTests/

  standard-campaign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Install browser tooling
        run: |
          npm ci --prefix tools
          npm exec --prefix tools -- playwright install --with-deps chromium
      - name: Standard campaigns (five launches)
        run: |
          ./gradlew --no-daemon :arraybuffer-benchmarks:jsBrowserDistribution :arraybuffer-benchmarks:wasmJsBrowserDistribution
          for run in 0 1 2 3 4; do
            ./gradlew --no-daemon :arraybuffer-benchmarks:runJvmBenchmarks \
              --args="--profile=standard --output=build/reports/arraybuffer/standard-jvm-run$run.json --run-index=$run"
            node tools/run-arraybuffer-benchmarks.mjs js \
              arraybuffer-benchmarks/build/dist/js/productionExecutable \
              --profile=standard --run-index=$run --output=build/reports/arraybuffer/standard-js-run$run.json
            node tools/run-arraybuffer-benchmarks.mjs wasm \
              arraybuffer-benchmarks/build/dist/wasmJs/productionExecutable \
              --profile=standard --run-index=$run --output=build/reports/arraybuffer/standard-wasm-run$run.json
          done
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arraybuffer-standard-reports
          path: build/reports/arraybuffer/
