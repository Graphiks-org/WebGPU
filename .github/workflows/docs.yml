name: Documentation

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MkDocs
        run: python3 -m pip install mkdocs-material mkdocs-static-i18n
      - name: Generate API reference
        run: ./gradlew --no-daemon :docs:embedDokkaIntoMkDocs
      - name: Build site
        run: mkdocs build --strict -f docs/mkdocs.yml
      - name: Check Pages size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(path.stat().st_size for path in Path('_site').rglob('*') if path.is_file())
          print(f'Pages site size: {size:,} bytes')
          if size >= 1_000_000_000:
              raise SystemExit('Pages site exceeds the 1 GB limit')
          PY
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
