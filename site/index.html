<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphiks WebGPU Suite — Validation</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div id="locale-switch" class="locale-switch"></div>
    <h1 id="page-title"></h1>
    <p id="page-subtitle"></p>
    <dl id="versions" class="versions"></dl>
  </header>

  <main>
    <section aria-labelledby="coverage-title">
      <h2 id="coverage-title"></h2>
      <p id="coverage-summary" class="meta"></p>
      <div class="table-wrap">
        <table id="coverage">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="js-title">
      <h2 id="js-title"></h2>
      <div id="js-details"></div>
    </section>

    <section aria-labelledby="wasm-title">
      <h2 id="wasm-title"></h2>
      <div id="wasm-details"></div>
    </section>

    <section aria-labelledby="run-title">
      <h2 id="run-title"></h2>
      <p id="run-description"></p>
      <ul id="run-links"></ul>
    </section>

    <section aria-labelledby="refs-title">
      <h2 id="refs-title"></h2>
      <ul id="reference-links"></ul>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
