  See [GPUTextureSampleType.Sint in the WebGPU specification](https://www.w3.org/TR/webgpu/#dom-gputexturesampletype-sint).
"GPUTextureSampleType#	Uint": |
  The texture produces unsigned-integer sample values.
"GPUTextureViewDimension": |
  Selects the dimensionality and array form of a GPUTextureView.
"GPUTextureViewDimension#	OneD": |
  A one-dimensional texture view.

  See [GPUTextureViewDimension in the WebGPU specification](https://www.w3.org/TR/webgpu/#enumdef-gputextureviewdimension).
"GPUTextureViewDimension#	TwoD": |
  A two-dimensional texture view.

  See [GPUTextureViewDimension in the WebGPU specification](https://www.w3.org/TR/webgpu/#enumdef-gputextureviewdimension).
"GPUTextureViewDimension#	TwoDArray": |
  A two-dimensional array texture view.

  See [GPUTextureViewDimension in the WebGPU specification](https://www.w3.org/TR/webgpu/#enumdef-gputextureviewdimension).
"GPUTextureViewDimension#	Cube": |
  The texture is viewed as a cubemap. Note: When viewed from the inside, this results in a left-handed coordinate system where +X is right, +Y is up, and +Z is forward.
"GPUTextureViewDimension#	CubeArray": |
  The texture is viewed as a packed array of n cubemaps, each with 6 array layers behaving like one "cube" view, for 6n array layers in total. texture_cube_array
"GPUTextureViewDimension#	ThreeD": |
  A three-dimensional texture view.

  See [GPUTextureViewDimension in the WebGPU specification](https://www.w3.org/TR/webgpu/#enumdef-gputextureviewdimension).
