"GPUStencilOperation": |
  Selects the operation applied to stencil values when a stencil test succeeds or fails.
"GPUStencilOperation#	Keep": |
  Keep the current stencil value.

  See [GPUStencilOperation.Keep in the WebGPU specification](https://www.w3.org/TR/webgpu/#dom-gpustenciloperation-keep).
"GPUStencilOperation#	Zero": |
  Set the stencil value to 0.

  See [GPUStencilOperation.Zero in the WebGPU specification](https://www.w3.org/TR/webgpu/#dom-gpustenciloperation-zero).
"GPUStencilOperation#	Replace": |
  Set the stencil value to [[stencilReference]].

  See [GPUStencilOperation.Replace in the WebGPU specification](https://www.w3.org/TR/webgpu/#dom-gpustenciloperation-replace).
"GPUStencilOperation#	Invert": |
  Bitwise-invert the current stencil value.

  See [GPUStencilOperation.Invert in the WebGPU specification](https://www.w3.org/TR/webgpu/#dom-gpustenciloperation-invert).
"GPUStencilOperation#	IncrementClamp": |
  Increments the current stencil value, clamping to the maximum representable value of the depthStencilAttachment’s stencil aspect.
"GPUStencilOperation#	DecrementClamp": |
  Decrement the current stencil value, clamping to 0.
"GPUStencilOperation#	IncrementWrap": |
  Increments the current stencil value, wrapping to zero if the value exceeds the maximum representable value of the depthStencilAttachment’s stencil aspect.
"GPUStencilOperation#	DecrementWrap": |
  Decrement the current stencil value, wrapping to the maximum representable value of the depthStencilAttachment’s stencil aspect if the value goes below 0.
