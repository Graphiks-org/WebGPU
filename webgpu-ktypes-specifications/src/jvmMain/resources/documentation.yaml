"GPUStoreOp": |
  Selects whether a render pass stores or discards an attachment's contents when the pass ends.
"GPUStoreOp#	Store": |
  Stores the resulting value of the render pass for this attachment.
"GPUStoreOp#	Discard": |
  Discards the resulting value of the render pass for this attachment. Note: Discarded attachments behave as if they are cleared to zero, but implementations are not required to perform a clear at the end of the render pass. Implementations which do not explicitly clear discarded attachments at the end of a pass must lazily clear them prior to the reading the attachment contents, which occurs via sampling, copies, attaching to a later render pass with "load", displaying or reading back the canvas (get a copy of the image contents of a context), etc.
