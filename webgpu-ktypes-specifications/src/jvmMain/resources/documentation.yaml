  Declares that this binding is not used by the pipeline.
"GPUSamplerBindingType#	Filtering": |
  The sampler supports filtering operations.

  See [GPUSamplerBindingType.Filtering in the WebGPU specification](https://www.w3.org/TR/webgpu/#dom-gpusamplerbindingtype-filtering).
"GPUSamplerBindingType#	NonFiltering": |
